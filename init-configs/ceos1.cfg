!
no aaa root
!
username ansible privilege 15 role network-admin secret ansible
!
vrf instance MGMT
!
service routing protocols model multi-agent
!
interface Management0
   vrf MGMT
   {{ if .MgmtIPv4Address }}   ip address {{ .MgmtIPv4Address }}/{{ .MgmtIPv4PrefixLength }}{{end}}
!
vlan 66,100
dhcp server
   subnet 172.16.100.0/24
      range 172.16.100.50 172.16.100.100
      default-gateway 172.16.100.1
    subnet 172.16.66.0/24
      range 172.16.66.50 172.16.66.100
!
interface Ethernet1
    switchport
    switchport mode trunk
    switchport trunk native vlan 66
!
interface Ethernet2
    no switchport
    ip address 172.16.99.1/24
!
interface Vlan100
   ip address 172.16.100.1/24
   dhcp server ipv4
!
interface vlan66
    description vlan_management_ap
    ip address 172.16.66.1/24
    dhcp server ipv4
!
ip routing
ip route 172.16.98.2/32 172.16.99.2
ip route vrf MGMT 0.0.0.0/0 172.16.1.1
!
ip name-server vrf MGMT 8.8.8.8
!
end